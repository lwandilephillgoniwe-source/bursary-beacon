kind = "web"
previewPath = "/"
title = "SA Opportunity Hub"
description = "A South African opportunity intelligence site publishing verified bursary and learnership pages. Phase 0: a branded landing page linking to the first server-rendered example bursary page."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
serve = "static"
publicDir = "artifacts/web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
